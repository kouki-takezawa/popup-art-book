<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP モック</title>
<style>
:root{--bg:#0a090e;--fg:#f1e7cf;--sub:#b8b0a0;--gold:#d4ad55;--line:rgba(241,231,207,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:16px;font-weight:400;letter-spacing:.2em;margin:0 12px 0 0}
button{font:inherit;font-size:14px;color:var(--fg);background:rgba(241,231,207,.06);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;letter-spacing:.08em}
button:hover{border-color:var(--gold)}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#st{font-size:13px;color:var(--sub);margin-left:auto}
#st.done{color:var(--gold)}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
p.note{margin:0;padding:8px 16px;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>OP モック</h1>
  <button data-op="1" aria-pressed="false">案1　机の上の一冊</button>
  <button data-op="2" aria-pressed="false">案2　扉で飛び出す</button>
  <button id="again">もう一度</button>
  <span id="st">案を選んでください</span>
</header>
<main><iframe id="f" title="OP の再生"></iframe></main>
<p class="note">OP の部分だけを流します(終わったら止まります)。毎回流れる・途中で飛ばせない・音なし、の想定です。</p>
<script>
const f=document.getElementById('f'),st=document.getElementById('st');let cur=0;
function play(op){
  cur=op;st.textContent='再生中…';st.className='';
  document.querySelectorAll('[data-op]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.op===op)));
  f.src=`../?op=${op}&only&r=${Date.now()}`;
}
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>play(+b.dataset.op));
document.getElementById('again').onclick=()=>cur&&play(cur);
addEventListener('message',e=>{if(e.source===f.contentWindow&&e.data==='op-done'){st.textContent='終わり（「もう一度」で再生）';st.className='done'}});
play(+(new URLSearchParams(location.search).get('op'))||1);
</script>
</body>
</html>

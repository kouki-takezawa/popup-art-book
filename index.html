<style>

#cap{left:50%;bottom:66px;transform:translateX(-50%);width:min(640px,88vw);box-sizing:border-box;background:rgba(241,231,207,.93);color:var(--ink);padding:14px 22px;font-size:14px;line-height:1.9;letter-spacing:.05em;border-radius:2px;box-shadow:0 6px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .9s;text-shadow:none}

  border:min(4.5vw,46px) solid transparent;
  border-image:linear-gradient(135deg,#8a6420,#f3d98a 18%,#a87a28 35%,#f0d27a 52%,#8a6420 70%,#e8c66a 86%,#7a5618) 1;
  box-shadow:inset 0 0 0 3px #3a2808,inset 0 0 80px 10px rgba(0,0,0,.65)}

<body>
<canvas id="c"></canvas>
<div class="hud" id="title">絵画の街をあるく絵本<b>夜のカフェテラス</b></div>

<div class="hud" id="cap"></div>
<div id="frame"></div>
<div id="plate">フィンセント・ファン・ゴッホ《夜のカフェテラス》1888年<br>この場所から見た構図で描かれた</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= 共通 =================
let seed=20250918;function R(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const pick=a=>a[R()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=k=>{const c1=1.4,c3=c1+1;return k<=0?0:k>=1?1:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const easeIO=k=>(k=clamp(k,0,1),k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function brush(g,x0,y0,w,h,cols,n,len,wid,ang,o={}){
  g.save();g.lineCap='round';
  const jit=o.jit??.6,bk=o.bend??.3,al=o.alpha??.9;
  for(let i=0;i<n;i++){
    const x=x0+R()*w,y=y0+R()*h;
    const a=(typeof ang==='function'?ang(x,y):ang)+(R()-.5)*jit;
    const l=len*(.6+R()*.8),c=Math.cos(a),s=Math.sin(a),b=(R()-.5)*l*bk;
    g.strokeStyle=pick(cols);g.globalAlpha=al*(.6+R()*.4);g.lineWidth=wid*(.6+R()*.8);
    g.beginPath();g.moveTo(x-c*l/2,y-s*l/2);g.quadraticCurveTo(x-s*b,y+c*b,x+c*l/2,y+s*l/2);g.stroke();
  }
  g.restore();
}
function clipRect(g,x,y,w,h,fn){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();fn();g.restore()}
const PAPER='#f1e7cf';
function cut(g,path,base,cols,n,len,wid,ang,box){
  g.save();g.beginPath();path(g);g.lineJoin='round';g.strokeStyle=PAPER;g.lineWidth=.07;g.stroke();
  g.fillStyle=base;g.fill();
  if(cols){g.clip();const b=box||[-5,-5,10,10];brush(g,b[0],b[1],b[2],b[3],cols,n,len,wid,ang)}
  g.restore();
}
const SKY=['#1c3a8c','#23479f','#15306f','#2e5bb5','#3a6cc0','#1b2a66','#2f6f9e'];
const CAFE=['#f7d65a','#e9a822','#fbe58a','#f2c230','#e8b53a','#f0c040'];
const AWN=['#f4b425','#f9d04a','#ef9a1c','#fde27c','#f7c235'];
const DARK=['#1e2b5c','#2a3c78','#33468a','#18214a','#4a3a72','#245066','#2c3a6a'];
const TEAL=['#1d3b52','#2f5f6e','#2a4a72','#3a6a6a','#1a2c4a','#2d5260'];
const LIT=['#f9d36a','#e07a22','#fbe58a','#f2a93b'];
const COB=['#c98fa6','#9fb0d6','#b49fd0','#6f87b8','#d8a37c','#8fae9a','#a8b8e0'];
const COBW=['#e7a86a','#d98f6a','#f0c27c','#c98fa6','#eeb27a'];
const TREE=['#24442e','#3a6b3e','#5b8f4a','#1a3324','#7aa65a','#2c5c5a'];
const FIG=['#1b1f36','#2a2f52','#3c2f45','#22283f'];
const ROOF=['#3b2f5e','#2a2448','#4b3d72','#5a3f5a','#33305a'];
const FONT='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif';

// ================= three =================
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a090e);
scene.fog=new THREE.Fog(0x0a090e,90,220);
const camera=new THREE.PerspectiveCamera(50,1,.1,600);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?70:50;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.AmbientLight(0x8090c0,.38));
const key=new THREE.SpotLight(0xfff0dd,1.05,0,.7,.6,0);
key.position.set(-22,52,40);key.target.position.set(0,0,-4);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=20;key.shadow.camera.far=140;key.shadow.bias=-.0004;
scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0x6a80d0,.35);rim.position.set(20,20,-30);scene.add(rim);
const lampL=new THREE.PointLight(0xffb040,0,19,1.3);scene.add(lampL);

function tex(wu,hu,draw,{center=false,ppu=120}={}){
  const S=Math.min(ppu,2048/Math.max(wu,hu));
  const c=cv(Math.max(4,Math.ceil(wu*S)),Math.max(4,Math.ceil(hu*S))),g=c.getContext('2d');
  g.save();g.translate(center?c.width/2:0,c.height);g.scale(c.width/wu,-c.height/hu);draw(g,wu,hu);g.restore();
  const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;return t;
}
function mat(t,emi=.45,alpha=false){
  return new THREE.MeshLambertMaterial({map:t,emissive:new THREE.Color(emi,emi,emi),emissiveMap:t,side:THREE.DoubleSide,alphaTest:alpha?.5:0});
}
function shadowy(m,t,alpha){m.castShadow=true;m.receiveShadow=true;if(alpha&&t)m.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:t,alphaTest:.5});return m}
function plane(w,h,material,alphaTex){return shadowy(new THREE.Mesh(new THREE.PlaneGeometry(w,h),material),alphaTex,!!alphaTex)}
function quad(a,b,c,d){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c,...d],3));g.setAttribute('uv',new THREE.Float32BufferAttribute([0,1,1,1,1,0,0,0],2));g.setIndex([0,3,2,0,2,1]);g.computeVertexNormals();return g}
function tri(a,b,c){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c],3));g.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,.5,1,1,0],2));g.computeVertexNormals();return g}
function box(w,h,d,m){return shadowy(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m))}
const lam=(c,e=.25)=>new THREE.MeshLambertMaterial({color:c,emissive:new THREE.Color(c).multiplyScalar(e)});

// ================= 本の骨組み =================
// ページ座標: 1ページ = 幅36 x 奥行56 (x:-18..18, z:-28..28)。手前(+z)が読者側。
const PS=.7,PFW=36,PFD=56,WP=PFW*PS,DP=PFD*PS;
const pageG=[new THREE.Group(),null,null,new THREE.Group()];
pageG[0].position.set(-WP/2,0,0);pageG[0].scale.setScalar(PS);
pageG[3].position.set(WP/2,0,0);pageG[3].scale.setScalar(PS);
scene.add(pageG[0],pageG[3]);
// めくれる紙(表=2ページ, 裏=3ページ)。曲げながらめくるので頂点を毎フレーム動かす
const leaf=new THREE.Group();leaf.position.y=.03;scene.add(leaf);
// めくれる紙に載る飛び出し部品(めくる間は畳んで隠すので、剛体回転で足りる)
const leafRigid=new THREE.Group();leafRigid.position.y=.03;scene.add(leafRigid);
pageG[1]=new THREE.Group();pageG[1].position.set(WP/2,.001,0);pageG[1].scale.setScalar(PS);leafRigid.add(pageG[1]);
const leafMeshes=[];
function leafMesh(material,pageIdx,w,h,cx,cz,y){
  const geo=new THREE.PlaneGeometry(w,h,64,1);geo.rotateX(-Math.PI/2);geo.translate(cx,y,cz);
  const m=new THREE.Matrix4().compose(V(WP/2,0,0),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,pageIdx===2?Math.PI:0)),V(PS,PS,PS));
  geo.applyMatrix4(m);
  const mesh=new THREE.Mesh(geo,material);mesh.receiveShadow=true;mesh.castShadow=true;
  mesh.userData.orig=Float32Array.from(geo.attributes.position.array);leaf.add(mesh);leafMeshes.push(mesh);return mesh;
}
function bendLeaf(theta){
  const N=128,ds=WP/N,px=new Float32Array(N+1),py=new Float32Array(N+1),ph=new Float32Array(N+1);
  let x=0,y=0;
  for(let k=0;k<=N;k++){const s=k*ds,phi=clamp(theta+.95*Math.sin(theta)*Math.pow(s/WP,1.4),0,Math.PI);px[k]=x;py[k]=y;ph[k]=phi;x+=Math.cos(phi)*ds;y+=Math.sin(phi)*ds}
  for(const m of leafMeshes){
    const o=m.userData.orig,p=m.geometry.attributes.position.array;
    for(let i=0;i<o.length;i+=3){
      const s=clamp(o[i],0,WP),f=s/ds,k=Math.min(N-1,f|0),t=f-k;
      const X=px[k]+(px[k+1]-px[k])*t,Y=py[k]+(py[k+1]-py[k])*t,P=ph[k]+(ph[k+1]-ph[k])*t,h=o[i+1];
      p[i]=X-Math.sin(P)*h;p[i+1]=Y+Math.cos(P)*h;p[i+2]=o[i+2];
    }
    m.geometry.attributes.position.needsUpdate=true;m.geometry.computeVertexNormals();m.geometry.computeBoundingSphere();
  }
}
// 紙の地
function paperBase(g,W,H,spineLeft){
  g.fillStyle='#efe5cb';g.fillRect(0,0,W,H);
  brush(g,0,0,W,H,['#e6d9b8','#f5edd6','#e9dcc0','#e2d2ae'],W*H/700,26,2.5,0,{alpha:.5,jit:3});
}
function gutter(g,W,H,spineLeft){
  const gw=W*.07,gr=spineLeft?g.createLinearGradient(gw,0,0,0):g.createLinearGradient(W-gw,0,W,0);
  gr.addColorStop(0,'rgba(60,40,20,0)');gr.addColorStop(1,'rgba(60,40,20,.4)');g.fillStyle=gr;g.fillRect(spineLeft?0:W-gw,0,gw,H);
}
function blankPage(num,spineLeft){
  const W=900,H=1400,c=cv(W,H),g=c.getContext('2d');
  paperBase(g,W,H);gutter(g,W,H,spineLeft);
  g.fillStyle='#8a7a5a';g.font='24px '+FONT;g.textAlign='center';g.fillText(String(num),spineLeft?W-60:60,H-30);
  const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;return t;
}
function pageMat(t,e=.2){const m=mat(t,e);m.side=THREE.FrontSide;return m}
// 1ページ目(左): 作品の説明
function wrapText(g,text,x,y,maxW,lh){
  let line='';for(const ch of text){if(g.measureText(line+ch).width>maxW){g.fillText(line,x,y);y+=lh;line=ch}else line+=ch}
  if(line){g.fillText(line,x,y);y+=lh}return y;
}
function descPage(){
  const S=30,W=PFW*S,H=PFD*S,c=cv(W,H),g=c.getContext('2d');
  paperBase(g,W,H);gutter(g,W,H,false);
  const L=4*S,MW=W-8*S;let y=5.5*S;
  g.textAlign='left';
  g.fillStyle='#8a6a2a';g.font=`${1.0*S}px ${FONT}`;g.fillText('第 1 話',L,y);y+=3.2*S;
  g.fillStyle='#2b2216';g.font=`${2.6*S}px ${FONT}`;g.fillText('夜のカフェテラス',L,y);y+=1.9*S;
  g.fillStyle='#6a5a3e';g.font=`italic ${1.0*S}px Georgia,serif`;g.fillText('Terrasse du café le soir',L,y);y+=2.2*S;
  g.strokeStyle='#b8a47a';g.lineWidth=.06*S;g.beginPath();g.moveTo(L,y);g.lineTo(W-L,y);g.stroke();y+=2*S;
  g.fillStyle='#3a2e1e';g.font=`${1.05*S}px ${FONT}`;g.fillText('フィンセント・ファン・ゴッホ　1888年9月',L,y);y+=1.6*S;
  g.fillStyle='#6a5a3e';g.font=`${.82*S}px ${FONT}`;g.fillText('油彩・カンヴァス　80.7 × 65.3 cm　クレラー・ミュラー美術館（オランダ）',L,y);y+=2.8*S;
  g.fillStyle='#3a2e1e';g.font=`${.95*S}px ${FONT}`;
  const paras=[
    '1888年、ゴッホは南フランスのアルルに移り住んだ。九月のある夜、彼はフォーラム広場に画架を立て、ガス灯に照らされたカフェのテラスを、その場で描いた。',
    '夜を描くのに、黒はほとんど使っていない。妹ヴィルへの手紙には「これは黒を一切使わない夜の絵だ」とある。夜空の深い青と、ガス灯の黄。補色どうしを並べて、光そのものを描こうとした。',
    '星を光の花のように描いたのも、この絵が最初とされる。翌年、彼は《星月夜》を描くことになる。',
  ];
  for(const t of paras){y=wrapText(g,'　'+t,L,y,MW,1.75*S);y+=1.1*S}
  y+=1.2*S;g.fillStyle='#8a6a2a';g.font=`${.95*S}px ${FONT}`;g.fillText('見どころ',L,y);y+=1.9*S;
  g.font=`${.9*S}px ${FONT}`;
  for(const t of ['黄色いテラスと青い夜空 ― 補色の響き合い','石畳に映る、桃色と紫の光','通りの奥へ吸い込まれる遠近法'])
    {g.fillStyle='#c9a24a';g.beginPath();g.arc(L+.3*S,y-.32*S,.18*S,0,7);g.fill();g.fillStyle='#3a2e1e';g.fillText(t,L+1*S,y);y+=1.7*S}
  g.textAlign='center';g.fillStyle='#8a6a2a';g.font=`${.8*S}px ${FONT}`;g.fillText('―　右のページで、この街が立ち上がります　―',W/2,H-4*S);
  g.fillStyle='#8a7a5a';g.font=`${.75*S}px serif`;g.fillText('1',2*S,H-.9*S);
  const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;return t;
}
// 2ページ目(右・ゴッホ)の地面
function goghGround(){
  const W=1536,H=2389,c=cv(W,H),g=c.getContext('2d');
  const X=x=>(x+18)/36*W,Z=z=>(z+28)/56*H,S=W/36;
  paperBase(g,W,H);
  const m=1.2,ix0=X(-18+m),ix1=X(18-m),iz0=Z(-28+m),iz1=Z(28-m);
  g.save();g.beginPath();g.rect(ix0,iz0,ix1-ix0,iz1-iz0);g.clip();
  g.fillStyle='#1e2547';g.fillRect(ix0,iz0,ix1-ix0,iz1-iz0);
  brush(g,ix0,iz0,ix1-ix0,iz1-iz0,DARK,3200,40,9,0);
  g.fillStyle='#232848';g.fillRect(X(-6.2),0,X(8.7)-X(-6.2),H);
  const cs=.42;let row=0;
  for(let z=-28;z<28;z+=cs*.82,row++){
    for(let x=-6.2+(row%2)*cs*.5;x<8.7;x+=cs){
      const warmK=x<1.8&&z>-19&&z<5?Math.max(0,1-Math.hypot(x+3.6,z+4)/13):0;
      g.fillStyle=R()<warmK*1.4?pick(COBW):pick(COB);
      g.beginPath();g.ellipse(X(x+(R()-.5)*.08),Z(z+(R()-.5)*.06),cs*.43*S,cs*.33*S,(R()-.5)*.6,0,7);g.fill();
      g.strokeStyle='rgba(255,245,220,.35)';g.lineWidth=2;g.beginPath();g.ellipse(X(x)-2,Z(z)-2,cs*.25*S,cs*.15*S,0,3.4,5.6);g.stroke();
    }
  }
  g.strokeStyle='rgba(246,211,107,.9)';g.lineWidth=5;g.setLineDash([14,10]);g.beginPath();g.arc(X(2.4),Z(9),.9*S,0,7);g.stroke();g.setLineDash([]);
  g.restore();
  gutter(g,W,H,true);
  g.fillStyle='#5a4a32';g.textAlign='center';
  g.font='30px '+FONT;g.fillText('夜のカフェテラス　―　フィンセント・ファン・ゴッホ　1888年9月　アルル、フォーラム広場',W/2,H-17);
  g.font='26px serif';g.fillText('2',W-60,H-17);
  g.font='italic 28px Georgia,serif';g.fillText('Terrasse du café le soir',W/2,38);
  const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;return t;
}
{
  const p0=new THREE.Mesh(new THREE.PlaneGeometry(PFW,PFD),pageMat(descPage()));p0.rotation.x=-Math.PI/2;p0.receiveShadow=true;pageG[0].add(p0);
  const p3=new THREE.Mesh(new THREE.PlaneGeometry(PFW,PFD),pageMat(blankPage(4,true)));p3.rotation.x=-Math.PI/2;p3.receiveShadow=true;pageG[3].add(p3);
  leafMesh(pageMat(goghGround(),.42),1,PFW,PFD,0,0,.001);
  leafMesh(pageMat(blankPage(3,false)),2,PFW,PFD,0,0,.001);
  // 小口と表紙
  const c=cv(512,32),g=c.getContext('2d');g.fillStyle='#e9dfc4';g.fillRect(0,0,512,32);
  for(let y=0;y<32;y+=2){g.fillStyle=y%4?'#d9ccaa':'#f3ead3';g.fillRect(0,y,512,1)}
  const et=new THREE.CanvasTexture(c);et.wrapS=THREE.RepeatWrapping;et.repeat.set(8,1);
  const sm=new THREE.MeshLambertMaterial({map:et,emissive:0x3a3428});
  for(const s of [-1,1]){
    const blk=new THREE.Mesh(new THREE.BoxGeometry(WP+.1,.8,DP+.1),sm);blk.position.set(s*WP/2,-.41,0);blk.receiveShadow=blk.castShadow=true;scene.add(blk);
    const cov=new THREE.Mesh(new THREE.BoxGeometry(WP+.7,.28,DP+.9),lam(0x5a1c1c,.3));cov.position.set(s*(WP/2+.3),-.95,0);cov.castShadow=cov.receiveShadow=true;scene.add(cov);
  }

  if(apron)cut(g,g=>{g.rect(x-.15,ty-.35,.3,.6)},'#eee7d4',['#ffffff','#d8d0c0'],30,.15,.05,Math.PI/2,[x-.2,ty-.4,.4,.7]);
  cut(g,g=>{g.arc(x,ty+.68,.12,0,7)},'#e2b48a');
  if(hat)cut(g,g=>{g.rect(x-.2,ty+.76,.4,.05);g.rect(x-.12,ty+.8,.24,.13)},'#11142a');
  if(dress)cut(g,g=>{g.ellipse(x,ty+.82,.2,.07,0,0,7)},'#5a3a4a');
}
function tableDraw(g,x){
  cut(g,g=>{g.rect(x-.04,.08,.08,.6);g.rect(x-.22,0,.44,.08)},'#4a3a26');
  cut(g,g=>{g.ellipse(x,.72,.44,.08,0,0,7)},'#e4dc8a',['#f2ea9a','#cfc46a','#fff5c0'],40,.15,.04,0,[x-.5,.6,1,.3]);
}
function chairDraw(g,x){
  cut(g,g=>{g.moveTo(x-.2,0);g.lineTo(x-.17,.45);g.lineTo(x+.2,.45);g.lineTo(x+.2,.95);g.lineTo(x+.25,.95);g.lineTo(x+.25,0);g.lineTo(x+.2,0);g.lineTo(x+.2,.4);g.lineTo(x-.13,.4);g.lineTo(x-.15,0);g.closePath()},'#6a4a2a');
}
function crossCard(parent,wu,hu,draw,n=2,emi=.5){
  const t=tex(wu,hu,draw);const m0=mat(t,emi,true);
  for(let i=0;i<n;i++){const m=plane(wu,hu,m0,t);m.position.y=hu/2;m.rotation.y=i*Math.PI/n;parent.add(m)}
}
let dl=2.5;
function piece(x,z,y,dir,build){const pg=popGroup(root,[x,y,z],dir,dl,.8);dl+=.05;build(pg);return pg}
function tableSet(pg,who,coat){
  crossCard(pg,1,.85,g=>tableDraw(g,.5));
  for(const [cx,cz,ry] of [[-.6,.1,0],[.6,-.1,Math.PI]]){const c=cardMesh(.6,1,g=>chairDraw(g,.3),.45);c.position.set(cx,0,cz);c.rotation.y=ry+.5;pg.add(c)}
  if(who){const p=cardMesh(.8,2.1,g=>person(g,.4,{sit:true,coat:coat||pick(['#1b1f36','#2a3c78','#3c2f45'])}),.5);p.position.set(-.55,0,.25);p.rotation.y=.6;pg.add(p)}
}
for(const [x,z,who] of [[-4.7,-2.2,1],[-2.5,-4.6,0],[-4.6,-7,1],[-2.6,-9.6,1],[-4.6,-12.2,0],[-2.5,-14.6,1],[-4.4,-17,0]])
  piece(x,z,.22,[0,-1],pg=>tableSet(pg,who));
piece(-1.7,-3.6,.22,[0,-1],pg=>{const p=cardMesh(.8,1.95,g=>person(g,.4,{hat:false,apron:true}),.6);p.rotation.y=.5;pg.add(p)});
piece(3.2,-8.5,0,[0,-1],pg=>pg.add(cardMesh(1.6,2.2,g=>{person(g,.45,{dress:true,hat:false});person(g,1.15,{coat:'#22283f'})},.45)));
piece(.8,-15,0,[0,-1],pg=>pg.add(cardMesh(.8,2,g=>person(g,.4,{coat:'#2a2f52'}),.45)));
piece(6.8,-5,0,[0,-1],pg=>pg.add(cardMesh(.8,2,g=>person(g,.4,{coat:'#3c2f45',hat:false,dress:true}),.45)));
piece(4.8,-21.5,0,[0,-1],pg=>{const m=cardMesh(3.4,2.6,(g)=>{
  cut(g,g=>{g.ellipse(.75,.9,.55,.34,0,0,7);g.rect(.3,0,.09,.7);g.rect(1.05,0,.09,.7);g.moveTo(1.15,1);g.lineTo(1.6,1.6);g.lineTo(1.75,1.45);g.lineTo(1.3,.85);g.closePath()},'#2a1e18',['#3a2a20','#1a120c'],40,.3,.06,0,[0,0,2,2]);
  cut(g,g=>{g.rect(1.6,.5,1.6,1.4);g.arc(2,.42,.4,0,7);g.arc(3,.42,.3,0,7)},'#1a2140',DARK,80,.3,.06,Math.PI/2,[1.5,0,1.8,2]);
  cut(g,g=>{g.arc(1.7,1.55,.14,0,7)},'#f7d65a');},.45);m.rotation.y=.35;pg.add(m)});
dl=3.0;
for(const [x,z] of [[-5.2,1.4],[-3.4,3.4]])piece(x,z,0,[0,1],pg=>tableSet(pg,0));
piece(7.4,4.2,0,[0,1],pg=>{
  const t=tex(5,7.6,(g,w,h)=>{
    cut(g,g=>{g.moveTo(2.2,0);g.lineTo(2.9,0);g.lineTo(2.75,3.2);g.lineTo(2.35,3.2);g.closePath()},'#2a1e18',['#3a2a20','#1a120c'],60,.4,.08,Math.PI/2,[0,0,w,h]);
    const blobs=[[2.5,5.2,1.9],[1.4,4.4,1.2],[3.6,4.5,1.2],[2.1,6.4,1.1],[3.3,6.2,1.0],[1.2,5.6,.9],[4,5.6,.85]];
    cut(g,g=>{for(const [x,y,r] of blobs){g.moveTo(x+r,y);g.arc(x,y,r,0,7)}},'#2c5034',TREE,900,.45,.1,(x,y)=>Math.atan2(y-5,x-2.5)+1.2,[0,0,w,h]);
  });
  const m0=mat(t,.4,true);
  for(let i=0;i<3;i++){const m=plane(5,7.6,m0,t);m.position.set(-.05,3.8,0);m.rotation.y=i*Math.PI/3;pg.add(m)}
});
piece(5.8,2.2,0,[0,1],pg=>pg.add(cardMesh(.8,2,g=>person(g,.4,{coat:'#22283f'}),.45)));
piece(3.6,9.3,0,[0,1],pg=>{const m=cardMesh(1.1,1.95,(g)=>{
  cut(g,g=>{g.moveTo(.2,0);g.lineTo(.27,0);g.lineTo(.6,1.9);g.lineTo(.53,1.9);g.closePath();g.moveTo(.9,0);g.lineTo(.83,0);g.lineTo(.5,1.9);g.lineTo(.57,1.9);g.closePath()},'#6a4a2a');
  cut(g,g=>{g.rect(.15,.95,.8,.9)},'#f1e7cf',null);
  cut(g,g=>{g.rect(.2,1.0,.7,.8)},'#1c3a8c',SKY,40,.12,.04,0,[.2,1,.7,.8]);
  cut(g,g=>{g.moveTo(.2,1);g.lineTo(.45,1);g.lineTo(.45,1.55);g.lineTo(.2,1.7);g.closePath()},'#f2c230',CAFE,20,.1,.04,1.2,[.2,1,.3,.7]);
},.55);m.rotation.y=Math.PI;pg.add(m)});

// ================= 平らなときの挿絵(印刷された1枚絵) =================
const IMG={w:30,h:18.75,z:-4};
const PAINTER_POSE={p:V(2.4,1.6,9),l:V(-1.5,4.5,-18)};
const rt=new THREE.WebGLRenderTarget(1280,800);
const printPaper=(()=>{
  const S=30,W=PFW*S,H=PFD*S,c=cv(W,H),g=c.getContext('2d'),Z=z=>(z+28)*S;
  paperBase(g,W,H);gutter(g,W,H,true);
  const x0=(18-IMG.w/2)*S,y0=Z(IMG.z-IMG.h/2);
  g.fillStyle='#e4d6b4';g.fillRect(x0-.9*S,y0-.9*S,(IMG.w+1.8)*S,(IMG.h+1.8)*S);
  g.strokeStyle='#5a4a32';g.lineWidth=.12*S;g.strokeRect(x0-.35*S,y0-.35*S,(IMG.w+.7)*S,(IMG.h+.7)*S);
  g.textAlign='center';g.fillStyle='#5a4a32';g.font=`${.9*S}px ${FONT}`;g.fillText('《夜のカフェテラス》　1888年',W/2,Z(IMG.z+IMG.h/2+2.6));
  g.fillStyle='#8a7a5a';g.font=`${.75*S}px serif`;g.fillText('2',W-2*S,H-.9*S);
  const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;return t;
})();
const printM=new THREE.MeshLambertMaterial({map:printPaper,emissive:new THREE.Color(.2,.2,.2),emissiveMap:printPaper,transparent:true,side:THREE.FrontSide});
const imgM=new THREE.MeshBasicMaterial({map:rt.texture,transparent:true,side:THREE.FrontSide});
const printMesh=leafMesh(printM,1,PFW,PFD,0,0,.06),imgMesh=leafMesh(imgM,1,IMG.w,IMG.h,0,IMG.z,.08);
printMesh.castShadow=imgMesh.castShadow=false;
bendLeaf(0);

// ================= 状態 =================
const SPREADS=[{name:'夜のカフェテラス',art:true},{name:'白紙'}];
const CAP={
  B:'1888年9月、南フランスのアルル。ゴッホはフォーラム広場のこのカフェを、夜、その場で描いた。',
  C:'黄色いガス灯の光と、夜空の青。黄と青は補色どうしで、並べると互いをいちばん鮮やかに見せる。',
  D:'妹ヴィルへの手紙に、ゴッホは「これは黒を一切使わない夜の絵だ」と書いている。',
  E:'星を白い点ではなく、光の花として描いた。ゴッホが星空を描いた最初の作品とされる。',
  F:'このカフェは今もアルルのフォーラム広場にあり、「カフェ・ヴァン・ゴッホ」として営業している。'
};
// カメラ台本(右ページの座標。x=-36 が左ページの中心)
const TOUR=[
  {t0:0,t1:6,f:u=>{const k=easeIO(u);return [V(-18,70-8*k,64-8*k),V(-18,0,-4)]}},
  {t0:6,t1:14.5,f:u=>{const a=.95-1.9*easeIO(u);return [V(Math.sin(a)*46,24-6*u,Math.cos(a)*46-6),V(0,4,-8)]},cap:'B'},
  {t0:14.5,t1:21.5,f:u=>{const k=easeIO(u);return [V(2.8-.4*k,3.6-2*k,27-18*k),V(-.4-1.1*k,3.6+.9*k,-18)]},cap:'C'},
  {t0:21.5,t1:28.5,f:u=>[V(2.4,1.6,9-.8*u),V(-1.5,4.5,-18)],cap:'D',frame:true},
  {t0:28.5,t1:35.5,f:u=>{const k=easeIO(u);return [V(.5+2.5*k,2+11*k,-1-7*k),V(-4.5+4.5*k,2.6+15*k,-11-16*k)]},cap:'E'},
  {t0:35.5,t1:42,f:u=>{const k=easeIO(u);return [V(3-21*k,13+49*k,-8+64*k),V(-18*k,3-3*k,-6+2*k)]},cap:'F'},
];
const TOUR_END=42,TOUR_LOOP=6,BL=1.6;
function tourPose(tau){
  if(tau>=TOUR_END)tau=TOUR_LOOP+(tau-TOUR_LOOP)%(TOUR_END-TOUR_LOOP);
  let i=TOUR.findIndex(s=>tau<s.t1);if(i<0)i=TOUR.length-1;const s=TOUR[i];
  let [p,l]=s.f(clamp((tau-s.t0)/(s.t1-s.t0),0,1));
  if(i>0&&tau-s.t0<BL){const [pp,pl]=TOUR[i-1].f(1),k=easeIO((tau-s.t0)/BL);p=pp.lerp(p,k);l=pl.lerp(l,k)}
  pageG[1].updateMatrixWorld(true);
  return {p:pageG[1].localToWorld(p),l:pageG[1].localToWorld(l),s,u:(tau-s.t0)/(s.t1-s.t0)};
}
const OVER={p:V(0,44,40),l:V(0,0,-1)};
function blankPose(tau){return {p:V(Math.sin(tau*.12)*6,40,36+Math.cos(tau*.12)*3),l:V(0,0,-1)}}

let active=0,target=0,phase='tour',tau=0,pc=0,flipT=0,paused=false,T=0;
let camFrom={p:OVER.p.clone(),l:OVER.l.clone()},tw=null;
const camLook=OVER.l.clone();
camera.position.copy(OVER.p);camera.lookAt(camLook);
const $=id=>document.getElementById(id);
function updateNav(){
  $('pg').textContent=`見開き ${target+1} / ${SPREADS.length}　${SPREADS[target].name}`;
  $('prev').disabled=target<=0;$('next').disabled=target>=SPREADS.length-1;
  $('title').querySelector('b').textContent=SPREADS[target].art?SPREADS[target].name:'　';
}
function request(i){
  if(i<0||i>=SPREADS.length||i===active||phase!=='tour')return;
  target=i;phase='fold';updateNav();
  tw={fp:camera.position.clone(),fl:camLook.clone(),tp:OVER.p.clone(),tl:OVER.l.clone(),t:0,dur:1.8};
}
$('prev').onclick=()=>request(active-1);$('next').onclick=()=>request(active+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')request(active+1);if(e.key==='ArrowLeft')request(active-1)});
$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ 再生':'❚❚ 一時停止'};

const capEl=$('cap');let capNow=null;
function setCap(k){if(k===capNow)return;capNow=k;if(k){capEl.textContent=CAP[k];capEl.style.opacity=1}else capEl.style.opacity=0}
const tmpV=new THREE.Vector3();
function setArt(p){ // 右ページの飛び出し具合 p: 0..3.9
  const vis=p>0.001;root.visible=vis;
  applyPops(vis?p+1.3:0);
  const op=1-clamp(p/.9,0,1);printM.opacity=imgM.opacity=op;printMesh.visible=imgMesh.visible=op>0.001;
}
// 平らなときの挿絵を、画家の視点から撮っておく
function snapshot(){
  setArt(3.9);printMesh.visible=imgMesh.visible=false;
  scene.updateMatrixWorld(true);
  const cam=new THREE.PerspectiveCamera(52,1.6,.1,600);
  cam.position.copy(pageG[1].localToWorld(PAINTER_POSE.p.clone()));cam.lookAt(pageG[1].localToWorld(PAINTER_POSE.l.clone()));
  lantern.getWorldPosition(tmpV);lampL.position.copy(tmpV);lampL.intensity=1.8;
  renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);
  setArt(0);
}
snapshot();
updateNav();

let last=performance.now();
function tick(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;T+=dt;
  if(phase==='tour'){
    if(SPREADS[active].art)pc=Math.min(3.9,pc+dt);
    tau+=dt;
  }else if(phase==='fold'){
    pc=Math.max(0,pc-dt*2.4);
    if(pc<=0&&!tw){phase='flip';flipT=0}
  }else if(phase==='flip'){
    flipT+=dt/2.4;const k=easeIO(flipT),fwd=target>active;
    bendLeaf(Math.PI*(fwd?k:1-k));
    if(flipT>=1){leafRigid.rotation.z=target>0?Math.PI:0;bendLeaf(leafRigid.rotation.z);startTour()}
  }
  setArt(pc);
  for(const s of stars)s.rotation.z=Math.sin(T*.3+s.userData.ph)*.3+T*s.userData.sp*.2;
  lantern.getWorldPosition(tmpV);lampL.position.copy(tmpV);
  lampL.intensity=root.visible?lampOn*(1.8+.08*Math.sin(T*7)+.05*Math.sin(T*13)):0;
  let pose,shot=null;
  if(phase==='tour'){
    if(SPREADS[active].art){const r=tourPose(tau);pose=r;shot=r}else pose=blankPose(tau);
    if(tau<3){const k=easeIO(tau/3);pose={p:camFrom.p.clone().lerp(pose.p,k),l:camFrom.l.clone().lerp(pose.l,k)}}
  }
  if(tw){tw.t+=dt;const k=easeIO(tw.t/tw.dur);pose={p:tw.fp.clone().lerp(tw.tp,k),l:tw.fl.clone().lerp(tw.tl,k)};if(tw.t>=tw.dur)tw=null}
  if(pose){camera.position.copy(pose.p);camLook.copy(pose.l)}
  camera.lookAt(camLook);
  setCap(phase==='tour'&&shot&&tau>2?shot.s.cap||null:null);
  const fr=phase==='tour'&&shot&&shot.s.frame&&shot.u>.12&&shot.u<.94;
  $('frame').style.opacity=fr?1:0;$('plate').style.opacity=fr?1:0;
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
function startTour(){active=target;phase='tour';tau=0;camFrom={p:camera.position.clone(),l:camLook.clone()}}
// 確認用: ?t=秒 ツアーのその時点で停止 / ?spread=2 / ?flip=0..1 めくり途中で停止
const qs=new URLSearchParams(location.search);
if(qs.has('spread')){active=target=+qs.get('spread')-1;leafRigid.rotation.z=active>0?Math.PI:0;bendLeaf(leafRigid.rotation.z);updateNav()}
if(qs.has('flip')){phase='flip';target=1;active=0;flipT=+qs.get('flip');paused=true;bendLeaf(Math.PI*easeIO(flipT));camera.position.copy(OVER.p);camLook.copy(OVER.l)}
if(qs.has('t')){tau=+qs.get('t');pc=3.9;camFrom={p:OVER.p.clone(),l:OVER.l.clone()};paused=true;setArt(pc)}
requestAnimationFrame(tick);
</script>
</body>

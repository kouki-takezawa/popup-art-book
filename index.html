<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名画の飛び出す絵本</title>
<meta name="description" content="名画が飛び出す絵本。西洋の名画10作品を、見開きごとに立ち上がる紙の立体で。">
<style>
:root{--ink:#2b2216;--paper:#f1e7cf;--gold:#c9a24a;--panel:#16141c;--band:#f6f3eb}
html,body{margin:0;height:100%;overflow:hidden;background:#0a090e;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;color:var(--paper)}
canvas#c{display:block;width:100vw;height:100vh;touch-action:none}
/* 文字は動く絵の上に直接置かず不透明な地に載せる。translate(-50%) の中央寄せは小数ピクセルでにじむので使わない */
.hud{position:fixed;pointer-events:none}
#title{top:12px;left:16px;font-size:13px;letter-spacing:.2em;background:var(--panel);padding:6px 12px;border-radius:2px}
#title b{display:block;font-size:20px;font-weight:400;letter-spacing:.3em;margin-top:2px}
button{font:inherit;color:var(--paper);background:var(--panel);border:1px solid rgba(241,231,207,.4);cursor:pointer;border-radius:2px}
button:disabled{opacity:.3;cursor:default}
#tools{position:fixed;top:16px;right:16px;display:flex;gap:8px}
#tools button{font-size:12px;letter-spacing:.15em;padding:7px 12px;display:flex;align-items:center;gap:6px}
/* アイコンは SVG(❚❚ ▶ などの文字は環境のフォントで形が変わる) */
.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}
#pause .play,#pause.paused .stop{display:none}
#pause.paused .play{display:block}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#back{display:none}
.hud,#tools,#nav{z-index:2}
#title,#pg,button{transition:color 1.4s,background-color 1.4s,border-color 1.4s}
#tap{position:fixed;z-index:2;left:0;right:0;margin:0 auto;width:max-content;bottom:62px;font-size:14px;letter-spacing:.2em;padding:8px 18px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
#tap.on{opacity:1;visibility:visible}
#nav{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:14px;white-space:nowrap}
#nav button{width:40px;height:34px;font-size:15px}
#pg{font-size:13px;letter-spacing:.18em;min-width:12em;text-align:center;background:var(--panel);padding:8px 14px;border-radius:2px}
/* 字幕まわり: 下端を固定し、高さはその作品でいちばん長い字幕に合わせる(字幕ごとに上端が跳ねないように)。額縁の場面でも位置は変えない */
#capbox{position:fixed;z-index:2;left:0;right:0;margin:0 auto;bottom:82px;width:min(640px,calc(100vw - 32px));pointer-events:none}
#prog{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:8px;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s;pointer-events:auto}
#prog.on{opacity:1;visibility:visible}
#prog>button{height:26px;padding:0 8px;font-size:12px;letter-spacing:.12em;display:flex;align-items:center;gap:4px}
#dots{display:flex;background:var(--panel);border-radius:13px;padding:0 4px}
#dots button{width:20px;height:26px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
#dots button::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(241,231,207,.35);transition:background-color .4s}
#dots button.done::before{background:rgba(241,231,207,.8)}
#dots button.on::before{background:var(--gold)}
#nextw{display:none!important}
#nextw.on{display:flex!important}
/* 額縁の場面でも、絵の上に乗るこの列は暗い地のまま */
body.framed #prog>button{background:var(--panel);color:var(--paper);border-color:rgba(241,231,207,.4)}
body.framed #dots button{background:transparent}
#cap{cursor:pointer;pointer-events:auto;display:flex;align-items:center;box-sizing:border-box;background:var(--paper);color:var(--ink);padding:14px 22px;font-size:clamp(13px,.3vw + 11px,15px);line-height:1.9;letter-spacing:.05em;border-radius:2px;box-shadow:0 6px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .9s}
/* 額縁の場面: 白い帯を上下にだけ出す(左右はなし)。題名・ボタン・ページ送りは帯の上に乗る */
#frame{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.4s;
  border-style:solid;border-color:var(--band);border-width:76px 0 64px;
  box-shadow:inset 0 1px 0 #d6cfbd,inset 0 -1px 0 #d6cfbd,inset 0 10px 12px -8px rgba(0,0,0,.45),inset 0 -10px 12px -8px rgba(0,0,0,.45)}
body.framed #title,body.framed #pg{background:transparent;color:var(--ink)}
body.framed button{background:transparent;color:var(--ink);border-color:rgba(43,34,22,.35)}
#plate{position:fixed;z-index:2;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);top:92px;background:var(--band);color:var(--ink);padding:9px 24px;font-size:13px;line-height:1.8;text-align:center;letter-spacing:.12em;border:1px solid #cfc6b0;box-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transition:opacity 1.4s;pointer-events:none;box-sizing:border-box}
body.framed #hint{display:none}
#hint{bottom:18px;left:16px;font-size:11px;letter-spacing:.12em;background:var(--panel);color:#b8b0a0;padding:6px 10px;border-radius:2px}
/* 読み込み中 */
#loading{position:fixed;inset:0;z-index:10;background:#0a090e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;letter-spacing:.3em;transition:opacity .8s}
#loading.done{opacity:0;pointer-events:none}
#loading b{font-weight:400;font-size:20px}
#loading span{font-size:12px;color:#b8b0a0}
#loading i{display:block;width:120px;height:2px;background:rgba(241,231,207,.15);overflow:hidden;position:relative}
#loading i::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:load 1.2s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition-duration:.15s!important}#loading i::after{animation:none;width:100%;opacity:.5}}
/* 解説と目次のパネル */
dialog{border:none;padding:0;background:var(--paper);color:var(--ink);border-radius:3px;box-shadow:0 10px 50px rgba(0,0,0,.6);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(10,9,14,.6)}
.dlg{position:relative;box-sizing:border-box;padding:28px 32px;overflow:auto;max-height:inherit}
.dlg .x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);border-color:rgba(43,34,22,.3)}
#sheet{width:min(620px,calc(100vw - 32px))}
#sheet .no{font-size:13px;color:#8a6a2a;letter-spacing:.2em}
#sheet h2{font-size:26px;font-weight:400;letter-spacing:.15em;margin:6px 40px 2px 0}
#sheet .orig{font:italic 15px Georgia,serif;color:#6a5a3e}
#sheet .meta{border-top:1px solid #b8a47a;margin-top:14px;padding-top:12px;font-size:14px;line-height:1.8}
#sheet .meta small{display:block;color:#6a5a3e;font-size:12px}
#sheet p{font-size:15px;line-height:2;text-indent:1em;margin:12px 0}
#sheet h3{font-size:14px;font-weight:400;color:#8a6a2a;letter-spacing:.2em;margin:18px 0 6px}
#sheet ul{margin:0;padding-left:1.4em;font-size:14px;line-height:1.9}
#sheet li::marker{color:var(--gold)}
#tocd{width:min(900px,calc(100vw - 32px))}
#tocd h2{font-size:18px;font-weight:400;letter-spacing:.3em;margin:0 40px 16px 0}
#toclist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
#toclist button{width:100%;padding:0;background:#fffaf0;color:var(--ink);border:1px solid #cfc6b0;text-align:left;overflow:hidden;display:block}
#toclist button[aria-current]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
#toclist img{display:block;width:100%;height:auto;aspect-ratio:400/206;object-fit:cover;background:#2a2620}
#toclist span{display:block;padding:7px 9px 9px;font-size:12px;line-height:1.6;letter-spacing:.05em}
#toclist small{display:block;color:#6a5a3e;font-size:11px}
@media (max-width:1000px){#hint{display:none}}
@media (max-width:640px){
  /* 狭い画面: ボタンはアイコンだけ、題名は作品名を省く(下のページ送りに出ている) */
  #tools{top:12px;right:12px;gap:6px}
  #tools .lb{display:none}
  #tools button{padding:8px 9px}
  #title{font-size:11px;padding:6px 10px}
  #title b{display:none}
  #tap{white-space:normal;max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center}
  #pg{min-width:0;max-width:calc(100vw - 140px);overflow:hidden;text-overflow:ellipsis}
  .dlg{padding:22px 18px}
  #sheet h2{font-size:21px}
  #toclist{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title">名画の飛び出す絵本<b>　</b></div>
<div class="hud" id="hint">◀ ▶ ページ　Shift+◀ ▶ 場面　Space 一時停止</div>
<div id="tools">
  <button id="toc" aria-label="目次"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg><span class="lb">目次</span></button>
  <button id="info" aria-label="解説"><svg class="i" viewBox="0 0 16 16"><path d="M8 4C6.5 3 4.5 2.6 2 2.8v9.6c2.5-.2 4.5.2 6 1.2 1.5-1 3.5-1.4 6-1.2V2.8C11.5 2.6 9.5 3 8 4zM8 4v9.6"/></svg><span class="lb">解説</span></button>
  <button id="back" aria-label="本にもどる"><svg class="i" viewBox="0 0 16 16"><path d="M6 3L2.5 6.5 6 10"/><path d="M2.5 6.5H10a3.5 3.5 0 010 7H7"/></svg><span class="lb">本にもどる</span></button>
  <button id="pause" aria-label="一時停止"><svg class="i f stop" viewBox="0 0 16 16"><rect x="3.5" y="3" width="3" height="10" rx=".5"/><rect x="9.5" y="3" width="3" height="10" rx=".5"/></svg><svg class="i f play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4a.5.5 0 00.77.42l8-5.2a.5.5 0 000-.84l-8-5.2a.5.5 0 00-.77.42z"/></svg><span class="lb">一時停止</span></button>
</div>
<button id="tap">本をタップすると、絵が立ち上がります</button>
<div id="capbox"><div id="prog">
  <button id="sprev" aria-label="前の場面"><svg class="i" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
  <span id="dots"></span>
  <button id="snext" aria-label="次の場面"><svg class="i" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
  <button id="nextw">次の作品へ<svg class="i" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
</div><div id="cap" aria-live="polite"></div></div>
<div id="frame"></div>
<div id="plate"></div>
<dialog id="sheet" aria-labelledby="sheet-h"><div class="dlg"><button class="x" aria-label="閉じる"><svg class="i" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button><div id="sheet-b"></div></div></dialog>
<dialog id="tocd" aria-labelledby="toc-h"><div class="dlg"><button class="x" aria-label="閉じる"><svg class="i" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button><h2 id="toc-h">目次</h2><ul id="toclist"></ul></div></dialog>
<div id="loading" role="status"><b>名画の飛び出す絵本</b><i></i><span>本を用意しています</span></div>
<div id="nav"><button id="prev" aria-label="前のページ">◀</button><div id="pg"></div><button id="next" aria-label="次のページ">▶</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/common.js"></script>
<!-- 作品: 見開きごとに1ファイル(未作成の見開きは白紙) -->
<script src="works/01_grande_jatte.js"></script>
<script src="works/02_moulin_galette.js"></script>
<script src="works/03_japanese_bridge.js"></script>
<script src="works/04_birth_of_venus.js"></script>
<script src="works/05_babel.js"></script>
<script src="works/06_the_dream.js"></script>
<script src="works/07_cafe_terrace.js"></script>
<script src="works/08_starry_night.js"></script>
<script src="works/09_nighthawks.js"></script>
<script src="works/10_empire_of_light.js"></script>
<script src="js/book.js"></script>
</body>
</html>
